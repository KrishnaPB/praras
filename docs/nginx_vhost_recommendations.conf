# ═══════════════════════════════════════════════════════════════════════════════
# Praras Biosciences & Airbliss — Recommended Nginx Vhost Configuration
# For deployment via CloudPanel (Site -> Vhost) or /etc/nginx/sites-available/
# ═══════════════════════════════════════════════════════════════════════════════

# 1. Custom 404 Error Document Routing
# Serves the branded /404.html page whenever any missing URL is requested
error_page 404 /404.html;
location = /404.html {
    internal;
    root /home/prarasbiosciences-test/htdocs/test.prarasbiosciences.com;
}

# 2. 301 Permanent SEO Redirect: Legacy product-*.html to products/*.html
# Preserves backlink equity from search engines and historical links
rewrite ^/product-(.*)\.html$ /products/$1.html permanent;

# 3. Modern HTTP Security Headers
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# 4. High-Performance Static Asset Caching (1 Year with Immutable Flag)
location ~* \.(css|js|webp|png|jpg|jpeg|svg|woff|woff2|ttf|ico)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    log_not_found off;
    tcp_nodelay off;
    open_file_cache max=3000 inactive=120s;
    open_file_cache_valid 45s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;
}

# 5. HTML Revalidation (Instant deployment propagation)
location ~* \.(html|htm)$ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
}

# 6. Restrict Sensitive Directories (Outside Public Reach)
location ~ ^/(enquiries|backups|scratch|templates|components|tools|docs|data|new)/ {
    deny all;
    return 404;
}

# 7. Protect Hidden Files, Scripts & Lock Files
location ~ /\.(?!well-known).* {
    deny all;
    return 404;
}

location ~ \.(json|lock|log|md|sh|py|docx?|xlsx?|zip|tar|gz|bak)$ {
    # Allow public product search index for client-side command palette
    location = /assets/data/products-search.json {
        allow all;
        add_header Cache-Control "public, max-age=3600";
    }
    deny all;
    return 404;
}
