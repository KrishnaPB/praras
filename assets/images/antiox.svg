<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4f4" />
      <stop offset="100%" stop-color="#f5e6e6" />
    </linearGradient>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f0f0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#9a1d1e" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <rect width="800" height="800" fill="url(#bg)"/>
  
  <g filter="url(#shadow)" transform="translate(250, 150)">
    <!-- Bottle cap -->
    <path d="M 115 0 L 185 0 C 190 0 195 5 195 10 L 195 40 L 105 40 L 105 10 C 105 5 110 0 115 0 Z" fill="#9a1d1e"/>
    <rect x="100" y="40" width="100" height="15" rx="5" fill="#751516"/>
    <!-- Bottle neck -->
    <path d="M 115 55 L 185 55 L 200 90 L 100 90 Z" fill="#e8e8e8"/>
    <!-- Bottle body -->
    <rect x="0" y="90" width="300" height="380" rx="40" fill="url(#bottle)"/>
    
    <!-- Label -->
    <rect x="25" y="150" width="250" height="230" rx="15" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    
    <!-- Label Brand -->
    <text x="150" y="195" font-family="'Inter', sans-serif" font-weight="bold" font-size="18" fill="#9a1d1e" text-anchor="middle" letter-spacing="3">PRARAS</text>
    <rect x="135" y="205" width="30" height="3" fill="#f08332"/>
    
    <!-- Product Name -->
    <text x="150" y="260" font-family="'Inter', sans-serif" font-weight="900" font-size="28" fill="#181412" text-anchor="middle">Antiox</text>
    
    <!-- Subtitle -->
    <text x="150" y="300" font-family="'Inter', sans-serif" font-size="13" fill="#78695e" text-anchor="middle">Brewery Solution</text>
    
    <!-- Bottom label decor -->
    <path d="M 25 340 L 275 340 L 275 365 C 275 373 268 380 260 380 L 40 380 C 32 380 25 373 25 365 Z" fill="#9a1d1e"/>
    <text x="150" y="365" font-family="'Inter', sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1">PREMIUM QUALITY</text>
  </g>
</svg>