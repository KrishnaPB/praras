name: Auto Deploy via FTP

on:
  push:
    branches:
      - main # Triggers the deploy when you push to the main branch

jobs:
  web-deploy:
    name: 🎉 Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code from GitHub
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python (Optional, if you want to run build script on server)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 🔨 Run Build Script (Optional)
        run: python3 build_static.py
        
      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # The directory on your server where the website files should go
          # Common paths: ./public_html/ or ./htdocs/ or /
          server-dir: ./public_html/
          
          # Files to ignore during upload
          exclude: |
            **/.git*
            **/.git*/**
            **/venv/**
            **/__pycache__/**
            **/*.md
            **/.github/**
            *.py
